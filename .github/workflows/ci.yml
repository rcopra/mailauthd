name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...
      - run: go vet ./...
      # M1: add fuzz smoke (`go test -fuzz FuzzSPF -fuzztime 10s`) and
      # golangci-lint once the first fuzz target lands.
